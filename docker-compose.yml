services:
  api:
    build: .
    ports:
      - "127.0.0.1:${SCROLLSTRACKER_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: Sqlite
      ConnectionStrings__Sqlite: Data Source=/data/scrollstracker.db
      DataProtection__KeysPath: /data/keys
      Administrador__Email: "${Administrador__Email:-}"
      Administrador__Senha: "${Administrador__Senha:-}"
    volumes:
      - ./data:/data
